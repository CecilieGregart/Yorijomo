<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yori Jomo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <!-- Venstre navigation -->
      <nav class="nav-left" aria-label="Main navigation">
        <a href="#collection">SHOP</a>
        <a href="#about">ABOUT</a>
      </nav>

      <!-- Logo -->
      <a href="index.html" class="logo">
        <img src="img/logo.webp" alt="Yori Jomo" />
      </a>

      <!-- Højre navigation -->
      <div class="nav-right">
        <!-- Søgeikon -->
        <button class="icon-button" type="button" aria-label="Search">
          <img src="img/soge.webp" class="search-icon" alt="" />
        </button>

        <!-- Shopping bag -->
        <button class="icon-button" type="button" aria-label="Shopping bag">
          <img src="img/bag.webp" class="bag-icon" alt="" />
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
      <!-- HERO SECTION -->
      <section class="hero">
        <!-- Hero billede -->
        <img
          src="img/herobillede.webp"
          alt="Yori Jomo fashion campaign"
          class="hero-image"
        />

        <!-- Hero indhold -->
        <div class="hero-content">
          <!-- Yori Jomo logo -->
          <div class="hero-logo">YORI JOMO</div>

          <!-- Overskrift -->
          <h1>JOY OF CHOOSING</h1>

          <!-- Beskrivelse -->
          <p>
            Italian craftsmanship. Copenhagen<br />
            perspective.
          </p>

          <!-- Knap -->
          <a href="#collection" class="hero-button"> View the collection </a>
        </div>
      </section>
    </main>
  </body>
</html>
